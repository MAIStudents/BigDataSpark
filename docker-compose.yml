version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bigdata
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./исходные данные:/data
    networks:
      - bigdata-net

  spark:
    image: jupyter/pyspark-notebook:latest
    container_name: spark
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - .:/home/jovyan/work
    networks:
      - bigdata-net
    depends_on:
      - postgres
      - clickhouse
      - cassandra
      - neo4j
      - mongodb
      - valkey

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - bigdata-net
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  cassandra:
    image: cassandra:latest
    container_name: cassandra
    ports:
      - "9042:9042"
    networks:
      - bigdata-net
    volumes:
      - cassandra_data:/var/lib/cassandra

  neo4j:
    image: neo4j:4.4
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    networks:
      - bigdata-net
    volumes:
      - neo4j_data:/data

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - bigdata-net
    volumes:
      - mongodb_data:/data/db

  valkey:
    image: redis/redis-stack:latest
    container_name: valkey
    ports:
      - "6379:6379"
    networks:
      - bigdata-net

networks:
  bigdata-net:
    driver: bridge

volumes:
  cassandra_data:
  neo4j_data:
  mongodb_data:
